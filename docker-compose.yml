services:
  dditFinalProject:
    image: ${DDIT_FINALPROJECT_IMAGE:-ghcr.io/facio313/ddit-finalproject:latest}
    build:
      context: .
      args:
        PORTFOLIO_BRANCH: ${PORTFOLIO_BRANCH:?PORTFOLIO_BRANCH must be set}
        PORTFOLIO_AUTH_MODE: ${PORTFOLIO_AUTH_MODE:?PORTFOLIO_AUTH_MODE must be set}
    environment:
      PORTFOLIO_BRANCH: ${PORTFOLIO_BRANCH:?PORTFOLIO_BRANCH must be set}
      PORTFOLIO_AUTH_MODE: ${PORTFOLIO_AUTH_MODE:?PORTFOLIO_AUTH_MODE must be set}
    container_name: dditFinalProject
    cpus: 0.75
    cpu_shares: 512
    mem_limit: 64m
    ports:
      - "127.0.0.1:5179:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ddit-finalproject/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
