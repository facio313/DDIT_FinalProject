server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /ddit-finalproject {
        return 308 /ddit-finalproject/;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
